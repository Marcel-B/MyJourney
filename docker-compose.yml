services:
  myjourney:
    build: .
    container_name: myjourney
    restart: unless-stopped
    ports:
      # Nur lokal binden – nach außen geht es über Tailscale (tailscale serve)
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    environment:
      # API-Key für /api und /mcp. Leer lassen = Zugriff offen (nur für Tests sinnvoll).
      - Security__ApiKeys__0=${MYJOURNEY_API_KEY:-}
      # Fester Login für die Web-Oberfläche (Hash erzeugen: siehe DEPLOY.md).
      # Beides leer lassen = kein Login, Schutz nur über den API-Key.
      - Security__Login__Username=${MYJOURNEY_LOGIN_USER:-}
      - Security__Login__PasswordHash=${MYJOURNEY_LOGIN_PASSWORD_HASH:-}
      # Öffentliche Basis-URL (z. B. https://<ct-name>.<tailnet>.ts.net) für das
      # OpenAPI-Schema – nötig für ChatGPT-Actions, sonst leer lassen.
      - PublicBaseUrl=${MYJOURNEY_PUBLIC_URL:-}
